; Großzügige PHP-Grenze. Die eigentliche Grenze (25 MB je Datei) setzen
; App\Support\Uploads, config/livewire.php und die Upload-Felder.
upload_max_filesize = 64M
post_max_size = 64M

; Behelf gegen „php2shell“ (CVE-2026-109618/-109619, 21.10.2026), bis der
; Hoster PHP 8.5.12 / 8.3.36 eingespielt hat – Empfehlung des PHP-Teams.
; post_max_size liegt schon unter einem Viertel von memory_limit (512M).
; Filament/Livewire schicken JSON, keine tief verschachtelten Formularfelder.
max_input_nesting_level = 8
session.upload_progress.enabled = 0
; erst ab PHP 8.5, ältere Versionen übergehen die Zeile
fatal_error_backtraces = 0
